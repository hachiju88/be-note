# Supabase ローカル開発設定
# 詳細: https://supabase.com/docs/guides/local-development

project_id = "be-note"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

# db reset 時に migrations 適用後へ投入する検証用シード
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
# ビフォー/アフター写真などを格納（署名付きURL配信）
file_size_limit = "50MiB"

[auth]
enabled = true
# サインイン後のリダイレクト先などはフロント実装時に調整
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# --- フェーズ1のソーシャルログイン ---------------------------------
# クレデンシャルは env 参照（env(NAME)）。実値は web/.env.local 等に置き、
# config.toml にはハードコードしないこと。
#
# Google（Supabase ネイティブ対応）: クレデンシャル設定後に有効化。
# [auth.external.google]
# enabled = true
# client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
# secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
#
# Instagram: Supabase のネイティブ外部プロバイダではない（要注意）。
#   - Instagram Login は Facebook(Meta) 基盤のため、Meta アプリ経由の
#     カスタム OIDC / 独自フローでの連携を別途検討する（M1 の認証設計で確定）。
# Be:note 独自ログイン: [auth.email]（上記）で enable_signup を使う前提。
# LINE はフェーズ2（本フェーズでは設定しない）。

[analytics]
enabled = false
